</head>
<body>
    <h1>Testando Favicon</h1>

    <p>O favicon é a imagem que aparece na aba do navegador, ao lado do título da página. Ele é importante para a identidade visual do site e para facilitar a identificação da página pelos usuários.</p>
    
</body>
